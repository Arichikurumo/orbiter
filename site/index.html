<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbiter</title>
<style>
:root{--bg:#07090d;--card:#0f141b;--line:#2a3340;--fg:#d9dee6;--mut:#7d8896;--gold:#c9a45c;--cyan:#4fd1e8;--ok:#5be3a0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh;
 background:radial-gradient(ellipse at top,#142230 0,transparent 60%),radial-gradient(ellipse at bottom right,#2a2110 0,transparent 50%),var(--bg) fixed}
nav{display:flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(7,9,13,.85);backdrop-filter:blur(6px);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--gold)}
.brand{color:var(--gold);font-weight:700;letter-spacing:.25em;text-transform:uppercase;margin-right:auto}
nav a{color:var(--mut);text-decoration:none;text-transform:uppercase;letter-spacing:.15em;font-size:13px;padding:8px 14px;border:1px solid transparent;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:color .2s,background .2s}
nav a:hover{color:var(--fg)}nav a.on{color:var(--cyan);background:rgba(79,209,232,.1);border-color:var(--cyan)}
nav button{background:none;border:1px solid transparent;color:var(--mut);text-transform:uppercase;letter-spacing:.15em;font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:color .2s,background .2s}
nav button:hover{color:var(--fg)}nav button.on,nav .dd.open button{color:var(--cyan);background:rgba(79,209,232,.1);border-color:var(--cyan)}
nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.dd{position:relative}
.menu{display:none;position:absolute;top:100%;left:0;min-width:170px;background:rgba(7,9,13,.97);border:1px solid var(--gold);padding:4px 0;z-index:3}
.dd.open .menu{display:block}
.menu a{display:block;clip-path:none;padding:10px 16px;white-space:nowrap}
.menu a.on{background:rgba(79,209,232,.1)}
a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
main{max-width:920px;margin:0 auto;padding:20px 16px}
section{background:linear-gradient(160deg,rgba(201,164,92,.07),transparent 40%),var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);padding:14px 20px;margin-bottom:20px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
h2{margin:0 0 8px;font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:.18em}
h2 small{color:var(--cyan);font-weight:400;letter-spacing:.05em;text-transform:none;margin-left:12px}
h2.tier{margin-top:18px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:13px}
label{display:flex;gap:12px;align-items:flex-start;padding:6px 4px;cursor:pointer;transition:background .15s}
label:hover{background:rgba(79,209,232,.05)}
label.done span{text-decoration:line-through;color:var(--mut)}
label small{color:var(--mut);display:block}
input[type=checkbox]{appearance:none;flex:none;width:18px;height:18px;margin:2px 0 0;border:1px solid var(--gold);transform:rotate(45deg) scale(.8);background:transparent;cursor:pointer;transition:background .2s,box-shadow .2s}
input[type=checkbox]:checked{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px var(--cyan)}
input[type=checkbox]:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
select,input[type=search]{background:#0a0e14;color:var(--fg);border:1px solid var(--line);padding:7px 12px;font:inherit;min-height:36px}
select:hover,input[type=search]:hover{border-color:var(--gold)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.frame{border-top:1px solid rgba(42,51,64,.6);padding:4px 0}
.frame b{margin-right:8px;letter-spacing:.05em}
.tag{font-size:12px;color:var(--gold)}
section>.tag{color:var(--mut)}
.how{color:var(--mut);font-size:13px;margin:0 0 6px 100px}
.frame img{width:64px;height:64px;object-fit:contain;flex:none;filter:drop-shadow(0 0 6px rgba(79,209,232,.25))}
.frame label{align-items:center}
.role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-left:6px;padding:1px 7px;border:1px solid var(--cyan);color:var(--cyan);white-space:nowrap}
.r-tank{border-color:#e0a050;color:#e0a050}.r-damage{border-color:#e06060;color:#e06060}.r-support{border-color:var(--ok);color:var(--ok)}.r-stealth{border-color:#a08ae0;color:#a08ae0}
a{color:var(--cyan)}
.hero{display:flex;align-items:center;gap:20px;margin-bottom:20px;padding:12px 8px}
.hero svg{flex:none;filter:drop-shadow(0 0 12px rgba(79,209,232,.35));animation:spin 60s linear infinite;animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{margin:0;font-size:26px;color:var(--gold);text-transform:uppercase;letter-spacing:.25em;font-weight:600}
.hero p{margin:4px 0 0;color:var(--mut)}
.prog{height:6px;background:#0a0e14;border:1px solid var(--line);margin:4px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));transition:width .3s}
.task.sub{margin-left:34px;padding-top:2px;padding-bottom:2px;border-left:1px solid var(--line);padding-left:12px}
.task.sub b{font-weight:400;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card{display:block;text-decoration:none;color:var(--fg);padding:14px 16px;border:1px solid var(--line);border-top:2px solid var(--gold);background:var(--card);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.card h2{margin:0 0 6px}.card p{margin:0;color:var(--mut);font-size:14px}
.evs{list-style:none;margin:0;padding:0}.evs li{padding:6px 0;border-top:1px solid rgba(42,51,64,.6)}.evs li:first-child{border-top:0}.evs small{display:block;color:var(--mut)}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.baro{margin:0 0 20px;padding:12px 18px;border:1px solid var(--cyan);background:rgba(79,209,232,.07);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.baro b{color:var(--cyan)}.baro small{display:block;color:var(--mut)}.baro ul{margin:6px 0 0;padding-left:20px;font-size:13px}
.meta{color:var(--gold)!important;font-size:12px!important}
.task small{margin-top:2px;font-size:13px;line-height:1.45}
.task.done b{text-decoration:line-through;color:var(--mut)}.task.done small{opacity:.6}
@media(prefers-reduced-motion:reduce){.hero svg{animation:none}}
@media(max-width:520px){.hero svg{width:80px;height:80px}.hero h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:760px){nav{padding:8px 12px;gap:2px;flex-wrap:wrap}.brand{display:none}nav a,nav button{padding:8px 10px;letter-spacing:.08em;white-space:nowrap}}
.chartwrap{position:relative;margin:8px 0;background:#0a0e14;aspect-ratio:16/9}
.chartwrap .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chart{position:absolute;inset:0;width:100%;height:100%;display:block}
.pl{cursor:pointer;outline:none}.pl circle{fill:rgba(0,0,0,0);stroke:rgba(201,164,92,.55);stroke-width:3;transition:fill .2s,stroke .2s}
.pl .nm{fill:#fff;font-size:34px;letter-spacing:.04em;paint-order:stroke;stroke:#000;stroke-width:6px;stroke-linejoin:round}
.pl .cnt{fill:#fff;font-size:34px;font-weight:700;paint-order:stroke;stroke:#000;stroke-width:6px}
.pl:hover circle,.pl:focus-visible circle{stroke:var(--cyan)}.pl:focus-visible circle{stroke-width:6}
.pl.on circle{fill:rgba(79,209,232,.22);stroke:var(--cyan);stroke-width:5;filter:drop-shadow(0 0 10px var(--cyan))}.pl.on .nm{fill:var(--cyan)}
.pl.dim{opacity:.3}
.task details>summary,section details>summary{cursor:pointer;list-style:none;margin-bottom:6px}summary::-webkit-details-marker{display:none}
.grid{display:grid;gap:20px;align-items:start;margin-bottom:20px}.grid>section{margin:0;min-width:0}
@media(min-width:900px){.grid.g2{grid-template-columns:repeat(2,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px) and (max-width:899px){.grid.g3{grid-template-columns:repeat(2,1fr)}}
main.wide{max-width:1280px}
.synhero{flex-wrap:wrap}.flagrow{display:flex;flex-wrap:wrap;gap:6px;max-width:460px}
.flag{object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}.flag.sm{width:36px;height:55px}
.synd{display:flex;gap:16px;align-items:flex-start}.synd .flags{flex:none;display:flex;flex-wrap:wrap;gap:6px;width:72px;justify-content:center}
.synd .syndbody{flex:1;min-width:0}
.bico{width:48px;height:48px;object-fit:contain;flex:none;filter:drop-shadow(0 0 6px rgba(79,209,232,.25))}
.task:has(.bico){align-items:center}
.imgnote{background:rgba(201,164,92,.12);border-bottom:1px solid var(--gold);padding:6px 16px;font-size:13px;text-align:center;color:var(--gold)}
.ver{margin:6px 0 0;font-size:13px}.ver b{color:var(--cyan)}
.kahlhero img{flex:none;filter:drop-shadow(0 0 14px rgba(201,164,92,.35))}
.mission{padding-top:0!important;overflow:hidden}
.banner{position:relative;margin:0 -20px 12px;height:150px;overflow:hidden;border-bottom:1px solid var(--gold)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(7,9,13,.85))}
.banner span{position:absolute;left:14px;bottom:8px;z-index:1;color:var(--cyan);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ico{vertical-align:middle;margin-right:6px}
.steps{margin:6px 0 8px;padding-left:22px;font-size:14px}.steps li{margin:6px 0;color:var(--fg)}
.tip{border:1px solid var(--cyan);background:rgba(79,209,232,.07);padding:10px 14px;margin-top:8px}
.detail{min-height:70px;border-top:1px solid var(--line);padding-top:8px}.detail h2{margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#0a0e14;color:var(--fg);border:1px solid var(--line);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip img{width:20px;height:20px;object-fit:contain}.chip:hover{border-color:var(--gold)}.chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(79,209,232,.1)}
@media(prefers-reduced-motion:reduce){.pl circle{transition:none}}
.fsub{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.frame b+.tag{margin-left:2px}
.rowtop{display:flex;align-items:center;gap:12px}.rowtop>label:first-child{flex:1;min-width:0}
.mast{flex:none;gap:6px!important;align-items:center!important;color:var(--mut);font-size:13px;white-space:nowrap}
.mast:has(input:checked){color:var(--ok)}
.noimg{width:64px;height:64px;flex:none}
</style>
</head>
<body>
<nav><span class="brand">Orbiter</span><a href="#home" id="n_home">Home</a><a href="#tasks" id="n_tasks">Tasks</a>

<script>
// Daily resets 00:00 UTC, weekly Monday 00:00 UTC. Edit SECTIONS to taste.
// Mirrors warframetools.com/Task-Checklist. Item: [id, name, description, subitems?, where/requirement?]
const SECTIONS=[
 {key:"daily",title:"Daily",reset:"d",items:[
  ["login","Log in","Collect the daily login reward."],
  ["forma","Crafting (Forma)","Start building a new Forma and collect finished ones.",0,"Foundry"],
  ["craft","Crafting (other)","Craft daily resources or items from reusable blueprints (check the Foundry or companion app).",0,"Foundry"],
  ["firstwin","Daily first win bonus","Your first mission of the day gives double base credits.",0,"Navigation"],
  ["factions","Faction syndicates: gain standing","Fill the daily standing cap with your pledged syndicates by gaining affinity in any mission.",0,"Needs Mastery Rank 3"],
  ["factionspend","Faction syndicates: spend maxed standing","If you are maxed on standing, spend it on Relic packs, Vosfor packs and similar.",0,"Any Relay, Syndicates"],
  ["worldsyn","World syndicates: gain standing","Standing with each world syndicate is capped daily. Tick the ones you have unlocked and cleared.",[
   ["s_simaris","Cephalon Simaris","Any Relay"],["s_ostron","Ostron","Cetus, Earth. Needs Saya's Vigil"],["s_quills","The Quills","Cetus, Earth. Needs The War Within"],
   ["s_solaris","Solaris United","Fortuna, Venus. Needs Vox Solaris"],["s_vox","Vox Solaris","Fortuna, Venus. Needs The War Within"],["s_vent","Ventkids","Fortuna, Venus. Needs Vox Solaris"],
   ["s_entrati","Entrati","Necralisk, Deimos. Needs Heart of Deimos"],["s_necraloid","Necraloid","Necralisk, Deimos. Needs The War Within"],
   ["s_hold","The Holdfasts","Chrysalith, Zariman. Needs Angels of the Zariman"],["s_cavia","Cavia","Sanctum Anatomica, Deimos. Needs Whispers in the Walls"],["s_hex","The Hex","Höllvania Central Mall. Needs The Hex quest"]]],
  ["bounties","Open-world bounties","Each hub's bounties give standing, mods, relics and resources. Tick the hubs you play.",[
   ["b_cetus","Ostrons","Konzu in Cetus (Plains of Eidolon)"],["b_fortuna","Solaris United","Eudico in Fortuna (Orb Vallis)"],["b_deimos","Entrati","Mother in the Necralisk (Cambion Drift)"],
   ["b_necraloid","Necraloid","No bounties of its own. Do Mother's Isolation Vault bounty for Orokin Matrices, then trade them to Loid"],
   ["b_zariman","Holdfasts","Quinn in the Chrysalith (Zariman Ten Zero)"],["b_cavia","Cavia","Fibonacci in Sanctum Anatomica"],["b_hex","The Hex","Bounty board in Höllvania Central Mall (1999)"]]],
  ["nwdaily","Nightwave","Complete the daily Nightwave acts."],
  ["sortie","Sortie","Complete the 3 daily Sortie missions. It rotates at 16:00 UTC, so tick it once per day.",0,"Navigation. Needs The War Within"],
  ["focus","Focus","Max out daily Focus gain, for example via Sanctuary Onslaught.",0,"Needs The Second Dream"],
  ["incursions","Steel Path Incursions","Complete the daily Steel Path missions for Steel Essence.",0,"Needs Steel Path unlocked"],
  ["kim","KIM: daily chats","Chat with your protoframes and other contacts each day.",[
   ["k_hex","The Hex (6)","Broadsword (Arthur), Salem (Eleanor), Belladona (Lettie), H16h V0l7463 (Amir), xX GLIMMER Xx (Aoi), Soldja1Shot1kil (Quincy)"],
   ["k_round","The Roundtable (3)","Liminus_Star (Flare, Rank 4 Hex), MomToxicated & PapaPolar (Minerva & Velimir, Rank 5 Hex), KOLTrial_5115 (Kaya, Rank 5 Hex)"],
   ["k_old","The Old Peace (3)","Marie, Roathe, Lyon"],["k_fables","Fables & Frontiers","\"Close\" with Amir"]],"Base of Operations, POM-2 PC. Needs The Hex quest"]]},
 {key:"dv",title:"Daily vendors",reset:"d",items:[
  ["acrithisd","Acrithis: daily offering","Check the daily Arcane and Captura offering.",0,"Duviri/Dormizone. Needs Drifter Intrinsics Opportunity Rank 9 for Arcanes"],
  ["ticker","Ticker: Railjack crew","Check the available Railjack crew to hire.",0,"Fortuna, Venus. Needs Rising Tide and Command Intrinsics 1"],
  ["marie","Marie","Purchase Tektolyst mods, Arcanes and Perita/Descendia resources.",0,"La Cathédrale, Sanctum Anatomica. Needs The Old Peace"]]},
 {key:"weekly",title:"Weekly",reset:"w",items:[
  ["nwweekly","Nightwave: weekly acts","Complete the relevant weekly Nightwave acts."],
  ["nwspend","Nightwave: spend credits","Spend Nightwave credits if needed (Aura mods, Catalysts/Reactors and so on)."],
  ["maroo","Ayatan Treasure Hunt","Complete Maroo's weekly mission for an Ayatan Sculpture.",0,"Maroo's Bazaar, Mars"],
  ["clem","Help Clem","Help Clem with his weekly survival, or he will die.",0,"Any Relay, Darvo. Needs A Man of Few Words"],
  ["narmer","Break Narmer","Complete Kahl's weekly mission for Stock.",0,"Drifter's Camp, Earth. Needs Veilbreaker"],
  ["archon","Archon Hunt","Complete the weekly Archon Hunt for a guaranteed Archon Shard.",0,"Navigation. Needs The New War"],
  ["circuit","Duviri Circuit (normal)","Check the weekly Warframe options and run the Circuit if desired.",0,"Needs The Duviri Paradox"],
  ["circuitsp","Duviri Circuit (Steel Path)","Check the weekly Incarnon Adapters and run the Circuit if desired.",0,"Needs Steel Path unlocked and The Duviri Paradox"],
  ["pulses","Search Pulses","Use the 5 weekly search pulses on Netracells and the Archimedeas."],
  ["netracells","Netracells","Complete up to 5 weekly Netracell missions for Archon Shard chances. Costs 1 Search Pulse per successful mission.",0,"Tagfer, Sanctum Anatomica. Needs Whispers in the Walls"],
  ["eda","Elite Deep Archimedea","Weekly endgame mission set with high Archon Shard chances. Costs 2 Search Pulses to unlock for the week.",0,"Necraloid, Sanctum Anatomica. Needs Rank 5 Cavia"],
  ["eta","Elite Temporal Archimedea","Weekly endgame mission set with high Archon Shard chances. Costs 2 Search Pulses to unlock for the week.",0,"Kaya Velasco, Höllvania. Needs Rank 5 The Hex"],
  ["cryobells","Cryobells","Harvest 3 Cryobells from Yuvan Peak. You can hold up to 6.",0,"Needs Angels of the Zariman and Whispers in the Walls"],
  ["icebind","The Icebind","Spend Cryobells (1 per player per successful mission) on six-player Icebind missions.",0,"Cephalon Melica, Yuvan Peak. Needs an unlocked EDA or ETA"],
  ["calendar","1999 Calendar","Complete the weekly Calendar tasks.",0,"POM-2 PC. Needs The Hex"],
  ["helminth","Helminth","Use your weekly Invigorations.",0,"Needs Rank 5 Entrati"],
  ["descendia","The Descendia (normal)","Weekly tower game mode for various resources.",0,"Needs Dark Refractory"],
  ["descendiasp","The Descendia (Steel Path)","Weekly tower game mode for various resources.",0,"Needs Dark Refractory"],
  ["eximus","Oops! All Eximus!","Exterminate Surge Eximus units for a Surge Eximus Specter Blueprint.",0,"Amir (Höllvandeim), Höllvania. Needs all 6 days of Fables & Frontiers"],
  ["clan","Clan weekly initiatives","Earn rewards by playing with clan members.",0,"Menu, Communication, Clan. Needs clan membership"]]},
 {key:"wv",title:"Weekly vendors",reset:"w",items:[
  ["palladino","Palladino","Trade Riven Slivers.",0,"Iron Wake, Earth. Needs The Chains of Harrow"],
  ["yonta","Archimedean Yonta","Buy weekly Kuva with Voidplumes.",0,"Chrysalith, Zariman. Needs Angels of the Zariman"],
  ["acrithisw","Acrithis: wares","Check wares and spend Pathos Clamps if desired (Catalysts/Reactors recommended). Buy Kuva with Scuttler Husks.",0,"Duviri/Dormizone. Needs The Duviri Paradox"],
  ["teshin","Teshin (Steel Path)","Check Teshin's Steel Essence shop, especially the Umbra Forma rotation every 8 weeks.",0,"Any Relay. Needs Steel Path unlocked"],
  ["bird3","Bird 3","Buy the weekly Archon Shard for 30k Cavia standing.",0,"Sanctum Anatomica. Needs Rank 5 Cavia"],
  ["kaya","Kaya","Trade Pix Chips for Arcanes.",0,"Höllvania. Needs Elite Temporal Archimedea"],
  ["nightcap","Nightcap","Trade Fergolyte for Kuva and an Ayatan Sculpture.",0,"Fortuna, Venus. Needs The New War"],
  ["zorba","Aspirant Zorba","Trade Atramentum for Kuva.",0,"Any Relay. Needs The Chains of Harrow"],
  ["hunhow","Hunhow","Trade Emerald and Crimson Talents for Kuva.",0,"Pontis Tower, Uranus. Needs Jade Shadows: Constellations"],
  ["melica","Cephalon Melica","Trade Entropic Kuva for Kuva.",0,"Yuvan Peak, Earth. Needs Angels of the Zariman and Whispers in the Walls"]]},
 {key:"other",title:"Other",reset:"w",items:[
  ["baro","Baro Ki'Teer","Check Baro's inventory and buy items with Ducats (trade Prime parts for Ducats). See the timer above.",0,"Relay with symbol"],
  ["family","Mend the Family","Purchase Family Tokens from Grandmother.",0,"Necralisk, Deimos. Needs Heart of Deimos"],
  ["voidplumes","Trade for Voidplumes","Trade with Yonta for Voidplumes.",0,"Chrysalith, Zariman"],
  ["voca","Trade for Voca","Trade with Loid for Voca.",0,"Sanctum Anatomica. Needs Whispers in the Walls"],
  ["tenet","Tenet weapons","Check Ergo Glast's shop for good valence bonuses.",0,"Any Relay. Needs The Archwing and Mastery Rank 14"],

];
const ALL=SECTIONS.flatMap(s=>s.items);
// "Mastered" is tracked separately from "collected": S.owned["M|"+id]. A mastered item you sold is still mastered.
const mastered=id=>!!S.owned["M|"+id];
const showOk=(s,o,m)=>s=="all"||(s=="missing"?!o:s=="have"?o:s=="unmastered"?!m:m);
const SHOW=[["all","All"],["missing","Not collected"],["have","Collected"],["unmastered","Not mastered"],["mastered","Mastered"]];
const mast=id=>`<label class="mast"><input type="checkbox" data-m="${esc(id)}" ${mastered(id)?'checked':''}> Mastered</label>`;
const IMG=n=>"img/"+n+".webp"; // pictures are bundled by fetch_images.py
const KEY="orbiter"; // older versions saved under "wfbuddy"
const flags=o=>Object.fromEntries(Object.entries(o&&typeof o=="object"&&!Array.isArray(o)?o:{}).filter(([k,v])=>v&&!["__proto__","constructor","prototype"].includes(k)).map(([k])=>[k,true]));

// The API has no version field, so the version is read from the newest news post flagged as an update (e.g. "...: Hotfix 44.1.2 + 2.1").
function gameVersion(){
 if(!W||!W.news)return"";
 const u=W.news.filter(x=>x.update).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date))[0];
 const v=u&&/\b(\d+\.\d+(?:\.\d+)*)\b/.exec(u.message);
 const build=/^(\d{4})\.(\d{2})\.(\d{2})/.exec(W.buildLabel||"");
 if(!v&&!build)return"";
 const link=u&&/^https?:\/\//i.test(u.link)?` &middot; <a href="${esc(u.link)}" target="_blank" rel="noopener">${esc(u.message)}</a>`:"";
 return `<p class="ver"><b>Game version ${v?esc(v[1]):"unknown"}</b>${build?` &middot; build ${build[1]}-${build[2]}-${build[3]}`:""}${link}</p>`;
}

  <li><b>Schedule</b><small>Baro arrives at a different Tenno Relay every two weeks and stays up to 48 hours. The timer above shows the next arrival, and your Inbox tells you when he lands.</small></li>
  <li><b>Currencies</b><small>Almost everything costs both Ducats and credits, so bring plenty of credits as well as Ducats.</small></li>
  <li><b>Getting Ducats</b><small>Trade spare Prime parts at a Ducat Kiosk in any Relay (this is from game knowledge, the wiki page I read did not cover it). Doubles and parts you will never use are the usual source.</small></li>
  <li><b>Save, do not rush</b><small>Many items return in later visits, so only buy what you need now and keep Ducats for the Primed mods you want.</small></li>
  <li><b>More detail</b><small><a href="https://wiki.warframe.com/w/Baro_Ki%27Teer" target="_blank" rel="noopener">Baro Ki'Teer on the wiki</a></small></li></ul></section></div>`;
}
const page=()=>({"#baro":"baro","#kahl":"kahl","#nightwave":"nightwave","#factions":"factions","#resources":"resources","#mods":"mods","#arcanes":"arcanes","#helminth":"helminth","#tasks":"tasks","#frames":"frames","#weapons":"weapons","#companions":"companions"})[location.hash]||"home";
function render(){const p=page();p=="home"?home():p=="resources"?resources():p=="nightwave"?nightwave():p=="factions"?factions():p=="kahl"?kahl():p=="baro"?baroPage():p=="tasks"?tasks():p=="frames"?frames():catalog(p)}
function closeMenus(except){document.querySelectorAll(".dd").forEach(d=>{if(d!==except){d.classList.remove("open");d.firstElementChild.setAttribute("aria-expanded","false")}})}
document.querySelectorAll(".dd>button").forEach(b=>b.addEventListener("click",e=>{
 e.stopPropagation();const d=b.parentElement,o=!d.classList.contains("open");closeMenus(d);d.classList.toggle("open",o);b.setAttribute("aria-expanded",o);
 const m=d.querySelector(".menu");m.style.left="";if(o){const over=m.getBoundingClientRect().right-(document.documentElement.clientWidth-8);if(over>0)m.style.left=-over+"px"} // keep the menu on screen
}));
addEventListener("resize",()=>closeMenus());
addEventListener("click",()=>closeMenus());
addEventListener("keydown",e=>{if(e.key=="Escape"){const o=document.querySelector(".dd.open>button");closeMenus();o&&o.focus()}});
function route(){
 const p=page();
 for(const k of["home","tasks","frames","weapons","companions","mods","arcanes","helminth","resources","nightwave","factions","kahl","baro"])document.getElementById("n_"+k).className=p==k?"on":"";
 const grp={frames:"collection",weapons:"collection",companions:"collection",mods:"build",arcanes:"build",helminth:"build",nightwave:"guides",factions:"guides",kahl:"guides",baro:"guides"};
 for(const g of["collection","build","guides"])document.getElementById("d_"+g).className=grp[p]==g?"on":"";
 closeMenus();
 document.querySelector('main').classList.toggle('wide',['home','tasks','nightwave','kahl','factions','baro'].includes(p));
 render();
}
addEventListener("hashchange",route);route();
// Server state wins when it has data; otherwise the browser's saved progress is uploaded once. Nothing is pushed before this finishes.
fetch("/api/state").then(r=>r.ok?r.json():null).then(srv=>{
 if(!srv||typeof srv!="object")return;
 ready=true;const s=mk(srv);
 if(Object.keys(s.tasks).length||Object.keys(s.owned).length){Object.assign(S,s);try{localStorage[KEY]=JSON.stringify(S)}catch{}render()}
 else if(Object.keys(S.tasks).length||Object.keys(S.owned).length)push();
}).catch(()=>{});
// First start: the server downloads the pictures in the background. Show progress, then redraw so they appear.
(function imgNote(){
 fetch("/api/images").then(r=>r.ok?r.json():null).then(s=>{
  let n=document.getElementById("imgnote");
  if(s&&s.running){
   if(!n){n=document.createElement("div");n.id="imgnote";n.className="imgnote";document.querySelector("nav").after(n)}
   n.textContent=`Downloading pictures for the first time: ${s.done + s.failed} of ${s.total}. They appear as soon as they are ready.`;setTimeout(imgNote,3000);
  }else if(n){n.remove();render()}
 }).catch(()=>{});
})();
loadBaro();setInterval(loadBaro,36e5);setInterval(()=>["tasks","home","nightwave","baro"].includes(page())&&render(),6e4);
</script>
